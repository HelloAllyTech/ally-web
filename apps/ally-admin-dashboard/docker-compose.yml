version: "3.8"

services:
  ally-admin-dashboard:
    build:
      context: ../../ # Build from workspace root
      dockerfile: apps/ally-admin-dashboard/Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
