<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ally Admin</title>
    <!-- Vite substitutes the build's `base` here, so relative URLs resolve
         against the mount point: "/" for the standalone dashboard, "/admin/"
         for the copy path-mounted on the consumer origin. -->
    <base href="%BASE_URL%" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="/favicon.ico?v=1" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=sticky_note,terminal"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
