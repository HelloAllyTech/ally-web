<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Ally</title>
    <meta name="description" content="Ally UI project" />
    <meta name="author" content="Ally" />
    <link
      href="https://fonts.googleapis.com/css2?family=ReplayPro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <!--
      Apply the persisted theme before first paint to avoid a flash of the
      default. Reads the same redux-persist "user" slice the app writes to (the
      value is JSON-encoded under the key "uiTheme"). Mirrors normalizeUiTheme in
      theme/themes.ts: legacy colour-theme ids (daylight/forest/sunset) collapse
      to "current". Dependency-free + fail-safe.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("persist:user");
          var theme = "current";
          if (raw) {
            var slice = JSON.parse(raw);
            var stored = slice && slice.uiTheme ? JSON.parse(slice.uiTheme) : null;
            if (["current", "claude", "carbon"].indexOf(stored) >= 0) {
              theme = stored;
            }
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "current";
        }
      })();
    </script>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
