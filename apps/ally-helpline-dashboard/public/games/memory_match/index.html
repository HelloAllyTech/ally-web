<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Memory Match</title>
<!--
  Ally course component: GAME / MEMORY_MATCH.

  A 4x4 deck of eight pairs. Flip two cards; if the icons match they stay up.
  Adapted from the "Sweet Memory Game" pen by Elior Tabeka
  (https://codepen.io/eliortabeka/pen/WwzEEg) — the rules, the move counter and
  the three-star rating are its design. Nothing else survives the port: the
  original leaned on jQuery, FontAwesome, SweetAlert2, animate.css and a Google
  font, and a bundle here has to run from an opaque origin with no network (the
  mobile app inlines this file into a WebView so a course works offline), so
  the markup, styles and logic below are hand-written vanilla against the Ally
  palette.

  This page is loaded in a sandboxed iframe by GameItemPlayer and in a WebView
  by the mobile GamePlayer, and talks to either only through postMessage — see
  the bridge at the bottom of this file for the contract.
-->
<style>
/*
  Ally tokens, copied as literals.

  The host's palette lives in CSS variables on its own document; a sandboxed
  iframe cannot see them, and the mobile WebView has no host document at all.
  These are the daylight (default) theme's values from the helpline app's
  index.css. A learner on another theme gets Ally blue rather than their theme's
  accent, which is the same trade the T-Rex bundle makes by being Chromium grey.
*/
:root {
  --primary-50: #EBF0FA;
  --primary-100: #D7E2F4;
  --primary-400: #4A7DCF;
  --primary-500: #264D8E;
  --primary-600: #1F3F75;

  --success-50: #E8F5E9;
  --success-200: #A5D6A7;
  --success-700: #388E3C;

  --destructive-50: #FFCDD2;
  --destructive-400: #F93535;
  --destructive-600: #C71818;

  --background: #FFFFFF;
  --background-secondary: #F4F4F4;
  --border-light: #E0E0E0;
  --border-medium: #C6C6C6;

  --typography-500: rgba(0, 0, 0, 0.32);
  --typography-700: rgba(0, 0, 0, 0.54);
  --typography-900: rgba(0, 0, 0, 0.87);

  /*
    IBM Plex Serif is Ally's face but it is served by the host app, and a font
    fetched from an opaque origin (or from an inlined WebView document) will not
    load. Georgia is the closest serif every target platform already has.
  */
  --font: "IBM Plex Serif", Georgia, "Times New Roman", serif;

  /*
    One square deck that fits whatever frame the host gives us. The host picks
    the frame height; this keeps the board square inside it either way.
    84px is the score panel plus the page's own padding.

    The width bound is `100%` of the flex row, not `100vw`: a frame that has
    not been given an explicit width — which is how an <iframe> starts life
    before layout settles, and what a headless browser reports throughout —
    resolves `100vw` to zero, and `min()` then collapses the whole board. A
    percentage of the parent cannot go wrong the same way.
  */
  --deck: min(100%, calc(100vh - 84px), 420px);
  --gap: clamp(5px, 2.2%, 11px);
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: var(--background);
  color: var(--typography-900);
  font-family: var(--font);
  font-size: 14px;
  line-height: 24px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.game {
  height: 100%;
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

/* ---- Score panel ------------------------------------------------------- */

.panel {
  width: var(--deck);
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Pairs found, as pips. A count of eight dots reads without a label, which
   matters because this page carries no prose the host could translate. */
.pairs {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
  min-width: 0;
}

.pip {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--border-light);
  transition: background 0.2s ease, transform 0.2s ease;
}

.pip.filled {
  background: var(--success-700);
  transform: scale(1.15);
}

.moves {
  color: var(--typography-700);
  font-size: 13px;
  white-space: nowrap;
}


.stars {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  color: var(--primary-500);
}

.star { width: 16px; height: 16px; display: block; }
.star.off { color: var(--border-light); }

.icon-button {
  appearance: none;
  border: 1px solid var(--border-light);
  background: var(--background);
  color: var(--typography-700);
  border-radius: 8px;
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.icon-button:hover {
  background: var(--primary-50);
  border-color: var(--primary-100);
  color: var(--primary-500);
}

.icon-button svg { width: 15px; height: 15px; display: block; }

/* ---- Deck -------------------------------------------------------------- */

.deck {
  width: var(--deck);
  height: var(--deck);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: var(--gap);
  perspective: 900px;
}

.card {
  appearance: none;
  border: 0;
  padding: 0;
  background: none;
  position: relative;
  cursor: pointer;
  transform: rotateY(180deg);
  transform-style: preserve-3d;
  transition: transform 0.28s ease;
}

.card.face-up { transform: rotateY(0deg); }

.card:disabled { cursor: default; }

/* Keyboard focus has to sit on the card, not a face, or the ring flips away
   with the card and a keyboard learner loses their place. */
.card:focus-visible {
  outline: 2px solid var(--primary-400);
  outline-offset: 2px;
  border-radius: 10px;
}

.face {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* Face down: solid Ally blue, no icon to read. */
.back {
  transform: rotateY(180deg);
  background: var(--primary-500);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
  transition: background 0.15s ease;
}

.card:not(:disabled):hover .back { background: var(--primary-600); }

/* Face up and still being judged. */
.front {
  background: var(--background);
  border: 2px solid var(--primary-400);
  color: var(--primary-500);
}

.front svg {
  width: 46%;
  height: 46%;
  display: block;
}

.card.matched .front {
  background: var(--success-50);
  border-color: var(--success-200);
  color: var(--success-700);
}

.card.wrong .front {
  background: var(--destructive-50);
  border-color: var(--destructive-400);
  color: var(--destructive-600);
}

.card.matched { animation: pop 0.4s ease; }
.card.wrong { animation: shake 0.4s ease; }

@keyframes pop {
  0%, 100% { transform: rotateY(0deg) scale(1); }
  45% { transform: rotateY(0deg) scale(1.09); }
}

@keyframes shake {
  0%, 100% { transform: rotateY(0deg) translateX(0); }
  20% { transform: rotateY(0deg) translateX(-5px); }
  50% { transform: rotateY(0deg) translateX(5px); }
  80% { transform: rotateY(0deg) translateX(-3px); }
}

/* A learner who has asked for less motion still needs to see the flip, so the
   card turn stays — only the celebratory jiggle goes. */
@media (prefers-reduced-motion: reduce) {
  .card.matched, .card.wrong { animation: none; }
}

/* ---- End-of-round overlay ---------------------------------------------- */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(255, 255, 255, 0.86);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.overlay[hidden] { display: none; }

.dialog {
  background: var(--background);
  border: 1px solid var(--border-light);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  padding: 20px;
  max-width: 300px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.dialog .stars { gap: 4px; }
.dialog .star { width: 24px; height: 24px; }

.dialog h1 {
  margin: 0;
  font-size: 16px;
  line-height: 28px;
  font-weight: 600;
  color: var(--typography-900);
}

.dialog p {
  margin: 0;
  font-size: 13px;
  line-height: 20px;
  color: var(--typography-700);
}

.button {
  appearance: none;
  margin-top: 6px;
  border: 0;
  border-radius: 8px;
  background: var(--primary-500);
  color: #FFFFFF;
  font-family: inherit;
  font-size: 14px;
  line-height: 24px;
  padding: 6px 20px;
  cursor: pointer;
  transition: background 0.15s ease;
}

.button:hover { background: var(--primary-600); }

.button:focus-visible {
  outline: 2px solid var(--primary-400);
  outline-offset: 2px;
}
</style>
</head>
<body>

<main class="game">
  <div class="panel">
    <div class="pairs" id="pairs" aria-hidden="true"></div>
    <p class="moves" id="moves"></p>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <button type="button" class="icon-button" id="restart"></button>
  </div>

  <div class="deck" id="deck"></div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="won-title">
    <div class="stars" id="won-stars" aria-hidden="true"></div>
    <h1 id="won-title"></h1>
    <p id="won-detail"></p>
    <button type="button" class="button" id="play-again"></button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---- Copy ------------------------------------------------------------ */

  /**
   * Everything a learner reads here. Baked in English and overridden by the
   * host, which is the side that knows their language: the web app sends these
   * with its `focus` message, the mobile app sets `window.__allyGameStrings`
   * before this document loads. English is the fallback either way, so a host
   * that sends nothing still gets a working game.
   */
  var STRINGS = {
    moves: '{{moves}} moves',
    restart: 'Start over',
    wonTitle: 'Board cleared',
    wonDetail: '{{moves}} moves — {{score}}% of a perfect round',
    playAgain: 'Play again',
    cardLabel: 'Card {{number}}'
  };

  if (window.__allyGameStrings) applyStrings(window.__allyGameStrings);

  function applyStrings(next) {
    for (var key in STRINGS) {
      if (Object.prototype.hasOwnProperty.call(next, key) &&
          typeof next[key] === 'string') {
        STRINGS[key] = next[key];
      }
    }
  }

  function fill(template, values) {
    return template.replace(/{{(\w+)}}/g, function (whole, name) {
      return Object.prototype.hasOwnProperty.call(values, name)
        ? String(values[name])
        : whole;
    });
  }

  /* ---- Icons ----------------------------------------------------------- */

  function svg(body, filled) {
    return '<svg viewBox="0 0 24 24" fill="' + (filled ? 'currentColor' : 'none') +
      '" stroke="' + (filled ? 'none' : 'currentColor') +
      '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' +
      ' focusable="false" aria-hidden="true">' + body + '</svg>';
  }

  var STAR_PATH = '<path d="M12 2.6l3 6.1 6.7 1-4.9 4.7 1.2 6.7L12 17.9l-6 3.2 1.2-6.7L2.3 9.7l6.7-1z"/>';

  /**
   * The eight pairs. Deliberately eight shapes that stay apart at a glance and
   * at 30px — a deck of near-identical glyphs turns a memory game into an
   * eyesight test.
   */
  var SYMBOLS = [
    '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/>',
    '<path d="M12 2.5l8.5 4.9v9.2L12 21.5 3.5 16.6V7.4z"/><path d="M3.7 7.4L12 12.2l8.3-4.8"/><path d="M12 21.5v-9.3"/>',
    '<path d="M13 2L4.1 12.8h6.4L11 22l8.9-10.8h-6.4z"/>',
    '<path d="M11 20a7 7 0 0 1-7-7c0-6 8-9 16-9 0 8-3 16-9 16z"/><path d="M4 21c2-6 5-9 9-11"/>',
    '<circle cx="12" cy="5" r="3"/><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/>',
    '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    '<path d="M12 2.7L6.3 8.4a8 8 0 1 0 11.4 0z"/>',
    '<circle cx="12" cy="12" r="9"/><path d="M16.2 7.8l-2.9 6.4-6.4 2.9 2.9-6.4z"/>'
  ];

  var RESTART_ICON = svg('<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>');

  /* ---- Rules ----------------------------------------------------------- */

  var PAIRS = SYMBOLS.length;
  /** A round in which every flip lands a pair: one move per pair. */
  var PERFECT_MOVES = PAIRS;
  /** Moves you can spend and still keep 3, 2 and 1 star, from the original. */
  var STAR_THRESHOLDS = [PAIRS + 2, PAIRS + 6, PAIRS + 10];
  /** How long a mismatched pair stays visible before flipping back. */
  var REVEAL_MS = 800;

  var deckEl = document.getElementById('deck');
  var pairsEl = document.getElementById('pairs');
  var movesEl = document.getElementById('moves');
  var starsEl = document.getElementById('stars');
  var restartEl = document.getElementById('restart');
  var overlayEl = document.getElementById('overlay');
  var wonStarsEl = document.getElementById('won-stars');
  var wonTitleEl = document.getElementById('won-title');
  var wonDetailEl = document.getElementById('won-detail');
  var playAgainEl = document.getElementById('play-again');

  var cards = [];
  var opened = [];
  var matched = 0;
  var moves = 0;
  var locked = false;
  var sessionBest = 0;
  var pendingTimers = [];

  /** Fisher-Yates. */
  function shuffle(array) {
    for (var i = array.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var swap = array[i];
      array[i] = array[j];
      array[j] = swap;
    }
    return array;
  }

  function starsFor(moveCount) {
    for (var i = 0; i < STAR_THRESHOLDS.length; i++) {
      if (moveCount <= STAR_THRESHOLDS[i]) return 3 - i;
    }
    return 0;
  }

  /**
   * The number the host records as a personal best, so it has to climb with
   * good play — moves do the opposite. This is how close the round came to a
   * perfect eight-move clear, which is the thing the game actually measures.
   */
  function scoreFor(moveCount) {
    if (!moveCount) return 0;
    return Math.min(100, Math.round((PERFECT_MOVES / moveCount) * 100));
  }

  function renderStars(target, count) {
    var html = '';
    for (var i = 0; i < 3; i++) {
      html += '<span class="star' + (i < count ? '' : ' off') + '">' +
        svg(STAR_PATH, true) + '</span>';
    }
    target.innerHTML = html;
  }

  function renderPanel() {
    var pips = '';
    for (var i = 0; i < PAIRS; i++) {
      pips += '<span class="pip' + (i < matched ? ' filled' : '') + '"></span>';
    }
    pairsEl.innerHTML = pips;
    movesEl.textContent = fill(STRINGS.moves, { moves: moves });
    renderStars(starsEl, starsFor(moves));
    restartEl.innerHTML = RESTART_ICON;
    restartEl.setAttribute('aria-label', STRINGS.restart);
    restartEl.setAttribute('title', STRINGS.restart);
    playAgainEl.textContent = STRINGS.playAgain;
  }

  function clearTimers() {
    pendingTimers.forEach(clearTimeout);
    pendingTimers = [];
  }

  function later(fn, ms) {
    pendingTimers.push(setTimeout(fn, ms));
  }

  function newRound() {
    clearTimers();
    overlayEl.hidden = true;
    deckEl.innerHTML = '';
    cards = [];
    opened = [];
    matched = 0;
    moves = 0;
    locked = false;
    announcedStart = false;

    var order = shuffle(SYMBOLS.concat(SYMBOLS).map(function (icon, index) {
      return { icon: icon, symbol: index % PAIRS };
    }));

    order.forEach(function (entry, index) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.setAttribute('aria-label', fill(STRINGS.cardLabel, { number: index + 1 }));
      card.innerHTML = '<span class="face back"></span>' +
        '<span class="face front">' + svg(entry.icon) + '</span>';
      card.addEventListener('click', function () { flip(card); });
      card.allySymbol = entry.symbol;
      deckEl.appendChild(card);
      cards.push(card);
    });

    renderPanel();
  }

  function flip(card) {
    if (locked || card.disabled || card.classList.contains('face-up')) return;

    markStarted();
    card.classList.add('face-up');
    opened.push(card);
    if (opened.length < 2) return;

    moves++;
    var first = opened[0];
    var second = opened[1];
    opened = [];

    if (first.allySymbol === second.allySymbol) {
      matched++;
      [first, second].forEach(function (el) {
        el.classList.add('matched');
        el.disabled = true;
      });
      renderPanel();
      if (matched === PAIRS) later(finish, 450);
      return;
    }

    // Both wrong cards stay readable for a beat — the whole point of the game
    // is getting a look at where they were — so the board is locked until they
    // turn back rather than letting a fast tap start a third card mid-flip.
    locked = true;
    first.classList.add('wrong');
    second.classList.add('wrong');
    renderPanel();
    later(function () {
      [first, second].forEach(function (el) {
        el.classList.remove('face-up', 'wrong');
      });
      locked = false;
    }, REVEAL_MS);
  }

  function finish() {
    var score = scoreFor(moves);
    sessionBest = Math.max(sessionBest, score);
    renderStars(wonStarsEl, starsFor(moves));
    wonTitleEl.textContent = STRINGS.wonTitle;
    wonDetailEl.textContent = fill(STRINGS.wonDetail, { moves: moves, score: score });
    overlayEl.hidden = false;
    playAgainEl.focus();
    post('over', { score: score, highScore: sessionBest });
  }

  restartEl.addEventListener('click', newRound);
  playAgainEl.addEventListener('click', newRound);

  /* ---- Host bridge ------------------------------------------------------ */

  /**
   * [Ally] Host bridge — the whole contract between a game bundle and the app.
   *
   * A game folder under /games/<key>/ is a self-contained page. It never
   * imports from the app and the app never reaches into it; they exchange
   * three messages. The same file runs in two hosts: an <iframe> in the web app
   * (messages go to window.parent) and a react-native-webview in the mobile app
   * (messages go to window.ReactNativeWebView as a JSON string).
   *
   *   game -> host  { source:'ally-game', game, type:'ready' }
   *   game -> host  { source:'ally-game', game, type:'started' }
   *   game -> host  { source:'ally-game', game, type:'over', score, highScore }
   *
   *   host -> game  { source:'ally-game-host', type:'focus', strings? }
   *
   * Scores are reported for the learner's personal best only. Games in a course
   * never gate progression, so nothing here blocks, unlocks or grades anything.
   */
  var GAME = 'MEMORY_MATCH';
  var iframeHost = window.parent !== window ? window.parent : null;

  function post(type, extra) {
    var message = { source: 'ally-game', game: GAME, type: type };
    for (var key in extra) {
      if (Object.prototype.hasOwnProperty.call(extra, key)) message[key] = extra[key];
    }
    if (window.ReactNativeWebView) {
      // WebView bridge only speaks strings.
      window.ReactNativeWebView.postMessage(JSON.stringify(message));
      return;
    }
    // '*' because a sandboxed iframe has an opaque origin that matches no
    // concrete target. Nothing here is worth protecting from the parent.
    if (iframeHost) iframeHost.postMessage(message, '*');
  }

  var announcedStart = false;
  function markStarted() {
    if (announcedStart) return;
    announcedStart = true;
    post('started');
  }

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || data.source !== 'ally-game-host') return;
    if (data.strings) {
      applyStrings(data.strings);
      // Labels are already on screen by the time this lands, so redraw them
      // rather than waiting for the next move.
      cards.forEach(function (card, index) {
        card.setAttribute('aria-label', fill(STRINGS.cardLabel, { number: index + 1 }));
      });
      renderPanel();
    }
    if (data.type === 'focus') window.focus();
  });

  newRound();
  post('ready');
})();
</script>
</body>
</html>
