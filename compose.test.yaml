# Docker Compose configuration for running tests
# Usage: docker-compose -f compose.test.yaml up --abort-on-container-exit
# Or use the test scripts in package.json

services:
  # Test runner for ally-helpline-dashboard
  helpline-test:
    build:
      context: .
      dockerfile: apps/ally-helpline-dashboard/Dockerfile.dev
    working_dir: /app/apps/ally-helpline-dashboard
    environment:
      - NODE_ENV=test
      - CI=true
      - NX_NO_CLOUD=true
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npx", "nx", "test", "ally-helpline-dashboard", "--run"]
    profiles:
      - test

  # Test runner for ally-admin-dashboard
  admin-test:
    build:
      context: .
      dockerfile: apps/ally-admin-dashboard/Dockerfile.dev
    working_dir: /app/apps/ally-admin-dashboard
    environment:
      - NODE_ENV=test
      - CI=true
      - NX_NO_CLOUD=true
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npx", "nx", "test", "ally-admin-dashboard", "--run"]
    profiles:
      - test

  # Test runner for ui-shared library
  ui-shared-test:
    build:
      context: .
      dockerfile: Dockerfile.deps
    working_dir: /app/libs/ui-shared
    environment:
      - NODE_ENV=test
      - CI=true
      - NX_NO_CLOUD=true
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npx", "nx", "test", "ui-shared", "--run"]
    profiles:
      - test

  # Run all tests in parallel
  test-all:
    build:
      context: .
      dockerfile: Dockerfile.deps
    working_dir: /app
    environment:
      - NODE_ENV=test
      - CI=true
      - NX_SKIP_NX_CACHE=true
      - NX_CLOUD_NO_TIMEOUTS=true
      - NX_NO_CLOUD=true
    volumes:
      - .:/app
      - /app/node_modules
      - test-coverage:/app/coverage
    command: ["npm", "run", "test"]
    profiles:
      - test

volumes:
  test-coverage:
    driver: local

# Notes:
# - Tests run in isolated containers with clean state
# - Use --abort-on-container-exit to stop after tests complete
# - Coverage reports are saved to a volume for analysis
# - Profiles keep test services separate from dev services
