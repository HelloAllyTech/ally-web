name: 'Build and Push Docker Image'
description: 'Builds and pushes optimized Docker images to ECR'

inputs:
  app_path:
    description: 'Path to the application directory'
    required: true
  dockerfile_path:
    description: 'Path to Dockerfile relative to app directory'
    required: true
  ecr_repository:
    description: 'ECR repository URL'
    required: true
  ecr_repository_name:
    description: 'ECR repository name'
    required: true
  aws_region:
    description: 'AWS region'
    required: true
  image_tag:
    description: 'Docker image tag'
    required: true
    default: 'latest'
  service_name:
    description: 'Service name'
    required: true
  s3_bucket:
    description: 'S3 bucket name'
    required: true

outputs:
  image_uri:
    description: 'Full ECR image URI with tag'
    value: ${{ steps.build.outputs.image_uri }}

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Download Environment Variables
      shell: bash
      working-directory: ${{ inputs.app_path }}
      run: |
        echo ":gear: Checking for environment variables..." >> $GITHUB_STEP_SUMMARY
        if aws s3 cp s3://${{ inputs.s3_bucket }}/${{ inputs.service_name }}/.env .env 2>/dev/null; then
          echo ":white_check_mark: Environment variables downloaded successfully" >> $GITHUB_STEP_SUMMARY
          echo "- S3 Path: s3://${{ inputs.s3_bucket }}/${{ inputs.service_name }}/.env" >> $GITHUB_STEP_SUMMARY
          echo "- File will be available during Docker build" >> $GITHUB_STEP_SUMMARY
        else
          echo ":information_source: No build-time environment variables found" >> $GITHUB_STEP_SUMMARY
          echo "- S3 Path: s3://${{ inputs.s3_bucket }}/${{ inputs.service_name }}/.env (not found)" >> $GITHUB_STEP_SUMMARY
          echo "- Proceeding with build without environment variables" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Build and push Docker image
      id: build
      shell: bash
      working-directory: ${{ inputs.app_path }}
      run: |
        # Set image URI
        IMAGE_URI="${{ inputs.ecr_repository }}/${{ inputs.ecr_repository_name }}:${{ inputs.image_tag }}"
        
        echo ":building_construction: Building Docker image..." >> $GITHUB_STEP_SUMMARY
        echo "- Repository: ${{ inputs.ecr_repository_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- Tag: ${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
        echo "- Dockerfile: ${{ inputs.dockerfile_path }}" >> $GITHUB_STEP_SUMMARY
        
        # Build and push image
        docker buildx build \
          --platform linux/amd64 \
          --file ${{ inputs.dockerfile_path }} \
          --tag $IMAGE_URI \
          --push \
          .
        
        echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
        echo ":white_check_mark: Image built and pushed successfully!" >> $GITHUB_STEP_SUMMARY
        echo "- Image URI: $IMAGE_URI" >> $GITHUB_STEP_SUMMARY 