name: 'Set Environment Variables'
description: 'Sets AWS and project variables based on environment'

inputs:
  environment:
    description: 'Target environment (dev, stg, prd)'
    required: true

outputs:
  aws_role:
    description: 'AWS IAM role ARN'
    value: ${{ steps.set-vars.outputs.aws_role }}
  aws_region:
    description: 'AWS region'
    value: ${{ steps.set-vars.outputs.aws_region }}
  ecr_repository:
    description: 'ECR repository URL'
    value: ${{ steps.set-vars.outputs.ecr_repository }}
  project_prefix:
    description: 'Project prefix for resource naming'
    value: ${{ steps.set-vars.outputs.project_prefix }}
  project_region:
    description: 'Project region code'
    value: ${{ steps.set-vars.outputs.project_region }}

runs:
  using: 'composite'
  steps:
    - name: Set Environment Variables
      id: set-vars
      shell: bash
      run: |
        case "${{ inputs.environment }}" in
          "dev")
            echo "aws_role=${{ vars.DEV_AWS_ROLE }}" >> $GITHUB_OUTPUT
            echo "aws_region=${{ vars.DEV_AWS_REGION }}" >> $GITHUB_OUTPUT
            echo "ecr_repository=${{ vars.DEV_ECR_REPOSITORY }}" >> $GITHUB_OUTPUT
            echo "project_prefix=life-dev" >> $GITHUB_OUTPUT
            echo "project_region=sg" >> $GITHUB_OUTPUT
            ;;
          "stg")
            echo "aws_role=${{ vars.STG_AWS_ROLE }}" >> $GITHUB_OUTPUT
            echo "aws_region=${{ vars.STG_AWS_REGION }}" >> $GITHUB_OUTPUT
            echo "ecr_repository=${{ vars.STG_ECR_REPOSITORY }}" >> $GITHUB_OUTPUT
            echo "project_prefix=life-stg" >> $GITHUB_OUTPUT
            echo "project_region=mb" >> $GITHUB_OUTPUT
            ;;
          "prd")
            echo "aws_role=${{ vars.PRD_AWS_ROLE }}" >> $GITHUB_OUTPUT
            echo "aws_region=${{ vars.PRD_AWS_REGION }}" >> $GITHUB_OUTPUT
            echo "ecr_repository=${{ vars.PRD_ECR_REPOSITORY }}" >> $GITHUB_OUTPUT
            echo "project_prefix=life-prd" >> $GITHUB_OUTPUT
            echo "project_region=mb" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "Invalid environment: ${{ inputs.environment }}"
            exit 1
            ;;
        esac 