# Production Release Pipeline - Ally Web
#
# This workflow handles production releases for ally-web (ECS service) with semantic versioning
# 
# Required GitHub Variables:
# PRD_AWS_ROLE, PRD_AWS_REGION, PRD_ECR_REPOSITORY
#
# Usage:
# - Manually trigger this workflow from GitHub Actions
# - Specify the version tag in format: v{major}.{minor}.{patch} (e.g., v1.0.0, v1.2.3, v2.0.0)
# - The workflow will create the tag, build, deploy to ECS, and create a release draft

name: Production Release - Ally Web

permissions:
  id-token: write
  contents: write  # Required for creating releases and tags

on:
  workflow_dispatch:
    inputs:
      version_tag:
        required: true
        type: string
        description: 'Version tag (e.g., v1.0.0, v1.2.3, v2.0.0)'

jobs:
  validate-and-tag:
    name: Validate Version and Create Tag
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      VERSION: ${{ steps.parse-version.outputs.VERSION }}
      MAJOR: ${{ steps.parse-version.outputs.MAJOR }}
      MINOR: ${{ steps.parse-version.outputs.MINOR }}
      PATCH: ${{ steps.parse-version.outputs.PATCH }}
      TAG: ${{ steps.parse-version.outputs.TAG }}
    
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      
      - name: Parse and validate version
        id: parse-version
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          echo "Processing tag: $TAG"
          
          # Validate tag format (v{major}.{minor}.{patch})
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Tag must be in format v{major}.{minor}.{patch} (e.g., v1.0.0)"
            exit 1
          fi
          
          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Error: Tag $TAG already exists"
            exit 1
          fi
          
          # Check if tag is newer than latest existing tag
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          if [ -n "$LATEST_TAG" ]; then
            echo "Latest existing tag: $LATEST_TAG"
            echo "New tag: $TAG"
            
            # Compare versions using sort -V (version sort)
            HIGHER=$(printf "%s\n%s" "$LATEST_TAG" "$TAG" | sort -V | tail -n 1)
            
            if [ "$HIGHER" != "$TAG" ]; then
              echo "❌ Error: Tag $TAG is not newer than the latest tag $LATEST_TAG"
              echo "Please use a version higher than $LATEST_TAG"
              echo ""
              echo "Current latest: $LATEST_TAG"
              echo "You tried:      $TAG"
              exit 1
            fi
            
            echo "✅ Version validation passed: $TAG is newer than $LATEST_TAG"
          else
            echo "ℹ️  No previous tags found. This will be the first release."
          fi
          
          # Remove 'v' prefix and parse version components
          VERSION=${TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "MAJOR=$MAJOR" >> $GITHUB_OUTPUT
          echo "MINOR=$MINOR" >> $GITHUB_OUTPUT
          echo "PATCH=$PATCH" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          
          echo "## :rocket: Release Version - Ally Web" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $TAG" >> $GITHUB_STEP_SUMMARY
          if [ -n "$LATEST_TAG" ]; then
            echo "- **Previous Tag**: $LATEST_TAG" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **First Release**: Yes ✨" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Full Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Major**: $MAJOR" >> $GITHUB_STEP_SUMMARY
          echo "- **Minor**: $MINOR" >> $GITHUB_STEP_SUMMARY
          echo "- **Patch**: $PATCH" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: master" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ally-web (ECS)" >> $GITHUB_STEP_SUMMARY
      
      - name: Create and push tag
        run: |
          TAG="${{ steps.parse-version.outputs.TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ally-web version ${{ steps.parse-version.outputs.VERSION }}"
          git push origin "$TAG"
          echo "✅ Tag $TAG created and pushed" >> $GITHUB_STEP_SUMMARY

  prepare-env:
    name: Prepare Production Environment
    needs: validate-and-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      aws_role: ${{ steps.env-vars.outputs.aws_role }}
      aws_region: ${{ steps.env-vars.outputs.aws_region }}
      ecr_repository: ${{ steps.env-vars.outputs.ecr_repository }}
      project_prefix: ${{ steps.env-vars.outputs.project_prefix }}
      project_region: ${{ steps.env-vars.outputs.project_region }}
      ecs_cluster: ${{ steps.service-vars.outputs.ecs_cluster }}
      ecs_service: ${{ steps.service-vars.outputs.ecs_service }}
      ecr_repository_name: ${{ steps.service-vars.outputs.ecr_repository_name }}
      task_definition: ${{ steps.service-vars.outputs.task_definition }}
      s3_bucket: ${{ steps.service-vars.outputs.s3_bucket }}
      container_name: ${{ steps.service-vars.outputs.container_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set Environment Variables
        id: env-vars
        uses: ./.github/actions/aws/set-environment-vars
        with:
          environment: prd
          prd_aws_role: ${{ vars.PRD_AWS_ROLE }}
          prd_aws_region: ${{ vars.PRD_AWS_REGION }}
          prd_ecr_repository: ${{ vars.PRD_ECR_REPOSITORY }}

      - name: Set Service Variables
        id: service-vars
        uses: ./.github/actions/aws/set-service-vars
        with:
          service_name: web
          project_prefix: ${{ steps.env-vars.outputs.project_prefix }}
          project_region: ${{ steps.env-vars.outputs.project_region }}

  test:
    name: Run Tests
    needs:
      - validate-and-tag
      - prepare-env
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      NX_NO_CLOUD: true
      NX_SKIP_NX_CACHE: true
      NX_CLOUD_ACCESS_TOKEN: ""
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        run: |
          echo ":test_tube: Running tests for ally-web..." >> $GITHUB_STEP_SUMMARY
          npm run test:web
          npm run test:ui-shared
          echo ":white_check_mark: All tests passed" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build and Push Docker Image
    needs:
      - validate-and-tag
      - prepare-env
      - test
    runs-on: ubuntu-22.04
    outputs:
      image_uri: ${{ steps.build-push.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.prepare-env.outputs.aws_role }}
          aws-region: ${{ needs.prepare-env.outputs.aws_region }}

      - name: Build and Push Docker Image with version tags
        id: build-push
        uses: ./.github/actions/docker/build-push
        with:
          app_path: apps/ally-web
          dockerfile_path: dockerfile
          ecr_repository: ${{ needs.prepare-env.outputs.ecr_repository }}
          ecr_repository_name: ${{ needs.prepare-env.outputs.ecr_repository_name }}
          aws_region: ${{ needs.prepare-env.outputs.aws_region }}
          image_tag: ${{ needs.validate-and-tag.outputs.VERSION }}
          service_name: web
          s3_bucket: ${{ needs.prepare-env.outputs.s3_bucket }}
          use_build_time_env: "true"

      - name: Tag additional version images
        run: |
          VERSION=${{ needs.validate-and-tag.outputs.VERSION }}
          MAJOR=${{ needs.validate-and-tag.outputs.MAJOR }}
          MINOR=${{ needs.validate-and-tag.outputs.MINOR }}
          ECR_REPO=${{ needs.prepare-env.outputs.ecr_repository }}
          ECR_REPO_NAME=${{ needs.prepare-env.outputs.ecr_repository_name }}
          
          # Login to ECR
          aws ecr get-login-password --region ${{ needs.prepare-env.outputs.aws_region }} | docker login --username AWS --password-stdin $ECR_REPO
          
          # Pull the versioned image
          docker pull $ECR_REPO/$ECR_REPO_NAME:$VERSION
          
          # Tag with additional versions
          docker tag $ECR_REPO/$ECR_REPO_NAME:$VERSION $ECR_REPO/$ECR_REPO_NAME:$MAJOR.$MINOR
          docker tag $ECR_REPO/$ECR_REPO_NAME:$VERSION $ECR_REPO/$ECR_REPO_NAME:$MAJOR
          docker tag $ECR_REPO/$ECR_REPO_NAME:$VERSION $ECR_REPO/$ECR_REPO_NAME:latest
          
          # Push additional tags
          docker push $ECR_REPO/$ECR_REPO_NAME:$MAJOR.$MINOR
          docker push $ECR_REPO/$ECR_REPO_NAME:$MAJOR
          docker push $ECR_REPO/$ECR_REPO_NAME:latest
          
          echo "## :package: Docker Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ECR_REPO/$ECR_REPO_NAME:$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ECR_REPO/$ECR_REPO_NAME:$MAJOR.$MINOR\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ECR_REPO/$ECR_REPO_NAME:$MAJOR\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ECR_REPO/$ECR_REPO_NAME:latest\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Production ECS
    needs:
      - build
      - prepare-env
      - test
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.prepare-env.outputs.aws_role }}
          aws-region: ${{ needs.prepare-env.outputs.aws_region }}

      - name: Deploy to ECS
        uses: ./.github/actions/aws/deploy-ecs
        with:
          image_uri: ${{ needs.build.outputs.image_uri }}
          ecs_cluster: ${{ needs.prepare-env.outputs.ecs_cluster }}
          ecs_service: ${{ needs.prepare-env.outputs.ecs_service }}
          task_definition: ${{ needs.prepare-env.outputs.task_definition }}
          aws_region: ${{ needs.prepare-env.outputs.aws_region }}
          port: "3000"
          container_name: ${{ needs.prepare-env.outputs.container_name }}

  create-release:
    name: Create Release Draft
    needs:
      - validate-and-tag
      - prepare-env
      - build
      - deploy
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${{ needs.validate-and-tag.outputs.VERSION }}
          TAG=${{ needs.validate-and-tag.outputs.TAG }}
          
          git fetch origin tag "$TAG"
          
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$TAG$" | head -n 1)
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using first commit"
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          
          echo "Generating changelog from $PREVIOUS_TAG to $TAG"
          
          # Generate changelog with proper formatting
          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          # Get commits since last tag (limit to 100 to avoid issues)
          git log $PREVIOUS_TAG..master --pretty=format:"- %s (%h) @%an" --no-merges -- apps/ally-web libs | head -100 >> CHANGELOG.md
          
          # Use a unique delimiter that won't appear in commit messages
          DELIMITER="CHANGELOG_END_$(date +%s)"
          echo "CHANGELOG<<${DELIMITER}" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT

      - name: Create Release Draft
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          name: Release Ally Web v${{ needs.validate-and-tag.outputs.VERSION }}
          tag_name: ${{ needs.validate-and-tag.outputs.TAG }}
          body: |
            ## Release Ally Web v${{ needs.validate-and-tag.outputs.VERSION }}
            
            ### Version Information
            - **Service**: ally-web
            - **Version**: ${{ needs.validate-and-tag.outputs.VERSION }}
            - **Major**: ${{ needs.validate-and-tag.outputs.MAJOR }}
            - **Minor**: ${{ needs.validate-and-tag.outputs.MINOR }}
            - **Patch**: ${{ needs.validate-and-tag.outputs.PATCH }}
            
            ### Deployment Information
            - **Environment**: Production
            - **Branch**: master
            - **Deployment Type**: ECS Service
            - **ECS Cluster**: ${{ needs.prepare-env.outputs.ecs_cluster }}
            - **ECS Service**: ${{ needs.prepare-env.outputs.ecs_service }}
            - **Docker Image**: ${{ needs.build.outputs.image_uri }}
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ---
            
            **Note**: This is a draft release. Please review and publish when ready.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

