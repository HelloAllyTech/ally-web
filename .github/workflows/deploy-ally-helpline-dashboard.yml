name: Deploy Ally Helpline Dashboard

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Choose environment
        options:
          - dev
          - stg
          - prd
  push:
    branches:
      - dev
      - stg
      - main
      - master
    paths:
      - 'apps/ally-helpline-dashboard/**'
  pull_request:
    branches:
      - dev
      - stg
      - main
      - master
    paths:
      - 'apps/ally-helpline-dashboard/**'

permissions:
  id-token: write
  contents: read

jobs:
  # Set app configuration
  config:
    runs-on: ubuntu-latest
    outputs:
      service_name: ${{ steps.set-config.outputs.service_name }}
      app_path: ${{ steps.set-config.outputs.app_path }}
      dockerfile_path: ${{ steps.set-config.outputs.dockerfile_path }}
      build_command: ${{ steps.set-config.outputs.build_command }}
      node_version: ${{ steps.set-config.outputs.node_version }}
      port: ${{ steps.set-config.outputs.port }}
    steps:
      - name: Set Configuration
        id: set-config
        run: |
          echo "service_name=fe" >> $GITHUB_OUTPUT
          echo "app_path=apps/ally-helpline-dashboard" >> $GITHUB_OUTPUT
          echo "dockerfile_path=dockerfile" >> $GITHUB_OUTPUT
          echo "build_command=npm run build" >> $GITHUB_OUTPUT
          echo "node_version=20" >> $GITHUB_OUTPUT
          echo "port=8080" >> $GITHUB_OUTPUT

  # Check if there are changes in the app directory
  changes:
    needs: config
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.changes.outputs.dashboard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Dynamic Filter
        id: create-filter
        run: |
          APP_PATH="${{ needs.config.outputs.app_path }}"
          echo "Creating filter for path: $APP_PATH"
          cat > filter.yml << EOF
          dashboard:
            - "${APP_PATH}/**"
          EOF
          echo "Generated filter:"
          cat filter.yml

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: filter.yml

  # Determine target environment
  determine-environment:
    needs: [config, changes]
    if: |
      needs.changes.outputs.dashboard == 'true' && 
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.env.outputs.target_env }}
      should_deploy: ${{ steps.env.outputs.should_deploy }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          MANUAL_ENV="${{ github.event.inputs.environment }}"
          
          # Determine target environment
          if [ -n "$MANUAL_ENV" ]; then
            TARGET_ENV="$MANUAL_ENV"
          else
            case $BRANCH in
              "dev")
                TARGET_ENV="dev"
                ;;
              "stg")
                TARGET_ENV="stg"
                ;;
              "main"|"master")
                TARGET_ENV="prd"
                ;;
              *)
                echo "No deployment configured for branch: $BRANCH"
                TARGET_ENV=""
                ;;
            esac
          fi
          
          if [ -n "$TARGET_ENV" ]; then
            echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo ":rocket: Deploying to: $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo ":warning: No deployment target determined" >> $GITHUB_STEP_SUMMARY
          fi

  # Deploy to determined environment
  deploy:
    needs: 
      - config
      - changes
      - determine-environment
    if: needs.determine-environment.outputs.should_deploy == 'true'
    uses: ./.github/workflows/deploy-ecs-service.yml
    with:
      service_name: ${{ needs.config.outputs.service_name }}
      app_path: ${{ needs.config.outputs.app_path }}
      environment: ${{ needs.determine-environment.outputs.target_env }}
      dockerfile_path: ${{ needs.config.outputs.dockerfile_path }}
      build_command: ${{ needs.config.outputs.build_command }}
      node_version: ${{ needs.config.outputs.node_version }}
      port: ${{ needs.config.outputs.port }}

  # Build and test on pull requests (no deployment)
  test:
    needs: [config, changes]
    if: |
      needs.changes.outputs.dashboard == 'true' && 
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: 'npm'
          cache-dependency-path: '${{ needs.config.outputs.app_path }}/package-lock.json'

      - name: Install Dependencies
        working-directory: ${{ needs.config.outputs.app_path }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install
          fi

      - name: Run Tests
        working-directory: ${{ needs.config.outputs.app_path }}
        run: |
          # Run tests if test script exists
          if npm run | grep -q "test"; then
            npm run test
          else
            echo "No test script found, skipping tests"
          fi

      - name: Build Application
        working-directory: ${{ needs.config.outputs.app_path }}
        run: ${{ needs.config.outputs.build_command }}

      - name: PR Summary
        run: |
          echo ":white_check_mark: Build and tests completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- Service: ${{ needs.config.outputs.service_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- No deployment performed (PR only)" >> $GITHUB_STEP_SUMMARY 