name: Deploy all services

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Choose environment to deploy all services
        options:
          - dev
          - stg
          - prd
      reason:
        required: false
        type: string
        description: Reason for manual deployment (optional)
        default: 'Manual deployment of all services'

permissions:
  actions: write
  contents: read

jobs:
  prepare-deployment:
    runs-on: ubuntu-22.04
    outputs:
      target-branch: ${{ steps.branch.outputs.branch }}
      deployment-reason: ${{ steps.reason.outputs.reason }}
    steps:
      - name: Get target branch
        id: branch
        run: |
          # Map environment input to branch
          case "${{ github.event.inputs.environment }}" in
            "dev")
              BRANCH="dev"
              ;;
            "stg")
              BRANCH="stg"
              ;;
            "prd")
              BRANCH="main"
              ;;
          esac
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Target branch: $BRANCH"

      - name: Set deployment reason
        id: reason
        run: |
          echo "reason=Manual deployment: ${{ github.event.inputs.reason }}" >> $GITHUB_OUTPUT

  trigger-deployments:
    needs: prepare-deployment
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set deployment info
        run: |
          echo "Deploying all services to: ${{ needs.prepare-deployment.outputs.target-branch }}"
          echo "Reason: ${{ needs.prepare-deployment.outputs.deployment-reason }}"

      - name: Trigger ally-web deployment
        uses: actions/github-script@v7
        with:
          script: |
            const targetBranch = '${{ needs.prepare-deployment.outputs.target-branch }}';
            const inputs = {
              "environment": "${{ github.event.inputs.environment }}",
              "force_deploy": "true"
            };
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-ally-web.yml',
              ref: `refs/heads/${targetBranch}`,
              inputs: inputs
            });

      - name: Trigger ally-helpline-dashboard deployment
        uses: actions/github-script@v7
        with:
          script: |
            const targetBranch = '${{ needs.prepare-deployment.outputs.target-branch }}';
            const inputs = {
              "environment": "${{ github.event.inputs.environment }}",
              "force_deploy": "true"
            };
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-ally-helpline-dashboard.yml',
              ref: `refs/heads/${targetBranch}`,
              inputs: inputs
            });

      - name: Log deployment triggers
        run: |
          echo "## Manual Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${{ needs.prepare-deployment.outputs.deployment-reason }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Branch:** ${{ needs.prepare-deployment.outputs.target-branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflows Triggered:**" >> $GITHUB_STEP_SUMMARY
          echo "- deploy-ally-web.yml" >> $GITHUB_STEP_SUMMARY
          echo "- deploy-ally-helpline-dashboard.yml" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Both services will be deployed with force_deploy=true to bypass change detection."
