name: Deploy Ally Web to CDN

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Choose environment
        options:
          - dev
          - prd
      force_deploy:
        required: false
        type: boolean
        description: Force deployment regardless of file changes
        default: false
  push:
    branches:
      - dev
    paths:
      - "apps/ally-web/**"
      - "libs/**"

permissions:
  id-token: write
  contents: read

jobs:
  # Set app configuration
  config:
    runs-on: ubuntu-22.04
    outputs:
      service_name: ${{ steps.set-config.outputs.service_name }}
      app_path: ${{ steps.set-config.outputs.app_path }}
      build_command: ${{ steps.set-config.outputs.build_command }}
      node_version: ${{ steps.set-config.outputs.node_version }}
      cdn_distribution_id: ${{ steps.set-config.outputs.cdn_distribution_id }}
      s3_bucket: ${{ steps.set-config.outputs.s3_bucket }}
      subdirectory: ${{ steps.set-config.outputs.subdirectory }}
    steps:
      - name: Set Configuration
        id: set-config
        run: |
          echo "service_name=ally-web" >> $GITHUB_OUTPUT
          echo "app_path=apps/ally-web" >> $GITHUB_OUTPUT
          echo "build_command=npm run build" >> $GITHUB_OUTPUT
          echo "node_version=20" >> $GITHUB_OUTPUT
          echo "cdn_distribution_id=E1AP5BIP58LJDY" >> $GITHUB_OUTPUT
          echo "s3_bucket=ally-dev-web-website" >> $GITHUB_OUTPUT
          echo "subdirectory=ally-web" >> $GITHUB_OUTPUT

  # Check if there are changes in the app directory
  changes:
    needs: config
    runs-on: ubuntu-22.04
    outputs:
      web: ${{ steps.determine.outputs.should_proceed }}
    steps:
      - name: Determine if should proceed
        id: determine
        run: |
          # Simplified logic - no redundant path checking
          if [ "${{ github.event.inputs.force_deploy }}" == "true" ]; then
            echo "should_proceed=true" >> $GITHUB_OUTPUT
            echo "Force deploy requested - proceeding without change check"
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "should_proceed=true" >> $GITHUB_OUTPUT
            echo "Push event detected - changes exist (filtered by trigger)"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_proceed=true" >> $GITHUB_OUTPUT
            echo "Manual workflow dispatch - proceeding"
          else
            echo "should_proceed=false" >> $GITHUB_OUTPUT
            echo "No valid trigger detected"
          fi

  # Determine target environment
  determine-environment:
    needs: [config, changes]
    if: needs.changes.outputs.web == 'true' || github.event.inputs.force_deploy == 'true'
    runs-on: ubuntu-22.04
    outputs:
      target_env: ${{ steps.env.outputs.target_env }}
      should_deploy: ${{ steps.env.outputs.should_deploy }}
      aws_role: ${{ steps.env.outputs.aws_role }}
      aws_region: ${{ steps.env.outputs.aws_region }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          MANUAL_ENV="${{ github.event.inputs.environment }}"

          # Determine target environment
          if [ -n "$MANUAL_ENV" ]; then
            TARGET_ENV="$MANUAL_ENV"
          else
            case $BRANCH in
              "dev")
                TARGET_ENV="dev"
                ;;
              "prd")
                TARGET_ENV="prd"
                ;;
              *)
                echo "No deployment configured for branch: $BRANCH"
                TARGET_ENV=""
                ;;
            esac
          fi

          if [ -n "$TARGET_ENV" ]; then
            echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo ":rocket: Deploying to: $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
            
            # Set AWS credentials based on environment
            if [ "$TARGET_ENV" == "dev" ]; then
              echo "aws_role=${{ vars.DEV_AWS_ROLE }}" >> $GITHUB_OUTPUT
              echo "aws_region=${{ vars.DEV_AWS_REGION }}" >> $GITHUB_OUTPUT
            elif [ "$TARGET_ENV" == "prd" ]; then
              echo "aws_role=${{ vars.PRD_AWS_ROLE }}" >> $GITHUB_OUTPUT
              echo "aws_region=${{ vars.PRD_AWS_REGION }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo ":warning: No deployment target determined" >> $GITHUB_STEP_SUMMARY
          fi

  # Build and deploy to CDN
  deploy:
    needs:
      - config
      - changes
      - determine-environment
    if: needs.determine-environment.outputs.should_deploy == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: "npm"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.determine-environment.outputs.aws_role }}
          aws-region: ${{ needs.determine-environment.outputs.aws_region }}

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Application
        env:
          NX_CLOUD_DISTRIBUTED_EXECUTION: false
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
        run: |
          echo ":hammer: Building ally-web for static hosting..." >> $GITHUB_STEP_SUMMARY
          npx nx build ally-web --skip-nx-cloud
          echo ":white_check_mark: Build completed successfully" >> $GITHUB_STEP_SUMMARY

      - name: Sync to S3
        run: |
          echo ":cloud: Syncing files to S3..." >> $GITHUB_STEP_SUMMARY
          aws s3 sync apps/ally-web/out/ s3://${{ needs.config.outputs.s3_bucket }}/${{ needs.config.outputs.subdirectory }}/ \
            --delete \
            --cache-control "public, max-age=86400" \
            --metadata-directive REPLACE
          echo ":white_check_mark: Files synced to S3 successfully" >> $GITHUB_STEP_SUMMARY
          echo "- S3 Bucket: s3://${{ needs.config.outputs.s3_bucket }}/${{ needs.config.outputs.subdirectory }}/" >> $GITHUB_STEP_SUMMARY

      - name: Invalidate CloudFront
        run: |
          echo ":arrows_counterclockwise: Creating CloudFront invalidation..." >> $GITHUB_STEP_SUMMARY
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ needs.config.outputs.cdn_distribution_id }} \
            --paths "/${{ needs.config.outputs.subdirectory }}/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo ":white_check_mark: CloudFront invalidation created" >> $GITHUB_STEP_SUMMARY
          echo "- Distribution ID: ${{ needs.config.outputs.cdn_distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Invalidation ID: $INVALIDATION_ID" >> $GITHUB_STEP_SUMMARY
          echo "- Invalidation Path: /${{ needs.config.outputs.subdirectory }}/*" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Summary
        run: |
          echo ":rocket: CDN Deployment Completed!" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.determine-environment.outputs.target_env }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Application**: ally-web" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ needs.config.outputs.s3_bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Subdirectory**: ${{ needs.config.outputs.subdirectory }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution**: ${{ needs.config.outputs.cdn_distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${GITHUB_REF#refs/heads/}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${GITHUB_SHA::8}" >> $GITHUB_STEP_SUMMARY
