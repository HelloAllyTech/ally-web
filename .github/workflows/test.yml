# Tests — the PR gate.
#
# Until this existed, NO Ally repo ran its tests on a pull request — every
# repo's suite ran only inside a `workflow_dispatch` deploy pipeline, i.e. on a
# manual release and nowhere else. Bug Hunter's nightly sweep had quietly become
# the de-facto CI, and its own fix PRs merged with no check at all.
#
# Deliberately its own workflow rather than a `pull_request` trigger on the
# deploy pipeline, which would ship every PR.
#
# NOTE ON ENFORCEMENT: adding this file makes the checks run and report, but does
# not make them mandatory — that is a branch-protection setting. Landed that way
# on purpose, so a suite that turns out to be red on master blocks nobody while
# it is being fixed. Mark "test" and "lint" as required checks once they are
# green.

# ally-web ships two independently-released apps plus a shared lib, so a
# ui-shared change needs both suites — `npm test` runs them via Nx's
# run-many, which is why this is one job rather than two.
#
# The suite is known to be red on master (ToggleButtonGroup and createSimulation
# specs). That is exactly why this lands as a reporting-only workflow: it makes
# the breakage visible without blocking anyone, and can be made required once
# those two are fixed.
#

name: Tests

on:
  pull_request:
    branches: [master]
  # Also on master, so the branch's own health is visible rather than inferred
  # from whichever PR last ran.
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A newer push supersedes the run in flight for the same ref — nobody needs the
  # result for a commit that has already been replaced.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          NX_NO_CLOUD: "true"

      - name: Run tests
        run: npm test
        env:
          NX_NO_CLOUD: "true"
          NX_DAEMON: "false"

  lint:
    name: Lint & format
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          NX_NO_CLOUD: "true"

      # REPORT-ONLY, deliberately. Lint had never run in CI in any Ally repo, so
      # its first run surfaced accumulated debt rather than anything this change
      # introduced — here, not yet measured; master also has an undefined SAMPLE_COUNT in LinguisticStyleSamplesPanel.
      # A check that is red on every PR from day one is a check people learn to
      # ignore, which would defeat the point of adding it. So this reports and
      # does not fail, and the violation count goes into the job summary where it
      # stays visible. Remove continue-on-error once the debt is cleared; that is
      # the moment to make this a required check alongside the test job.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Check formatting
        continue-on-error: true
        run: npm run format:check

  # NOT report-only, unlike the lint job above: the debt was 11 errors total
  # (10 admin, 1 helpline, 0 ui-shared) and this PR clears all of them, so there
  # is nothing to grandfather. Mark "Typecheck" required alongside "Vitest".
  #
  # Why this job exists at all: on 2026-08-26 two PRs that were each green in
  # isolation merged in sequence — one removed PrivateLayout's `requiredRole`
  # prop and RouteLayout's SUPER_ADMIN_ROLES import, the other added Builder
  # routes still passing it. That left `ReferenceError: SUPER_ADMIN_ROLES is not
  # defined` in the admin app's whole route tree, i.e. an admin console that
  # white-screens on load, and nothing in CI objected: vite/esbuild strip types
  # without checking them, and the lint job is continue-on-error. It surfaced
  # only because 15 RouteLayout specs happened to render the crashing component.
  # `tsc` reports it as four errors in seconds, before any suite runs.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          NX_NO_CLOUD: "true"

      # Per-project tsconfigs rather than one root pass: each app has its own
      # path aliases and lib set, and the root tsconfig.json is a solution file
      # with no files of its own.
      - name: Typecheck admin dashboard
        run: npx tsc --noEmit -p apps/ally-admin-dashboard/tsconfig.app.json

      - name: Typecheck helpline dashboard
        run: npx tsc --noEmit -p apps/ally-helpline-dashboard/tsconfig.app.json

      - name: Typecheck ui-shared
        run: npx tsc --noEmit -p libs/ui-shared/tsconfig.lib.json
