name: Deploy Ally Web

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Choose environment
        options:
          - dev
          - stg
          - prd
      force_deploy:
        required: false
        type: boolean
        description: Force deployment regardless of file changes
        default: false
  push:
    branches:
      - dev
      - stg
      - main
      - master
    paths:
      - 'apps/ally-web/**'
      - 'libs/**'
  pull_request:
    branches:
      - dev
      - stg
      - main
      - master
    paths:
      - 'apps/ally-web/**'
      - 'libs/**'

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  # Set app configuration
  config:
    runs-on: ubuntu-22.04
    outputs:
      service_name: ${{ steps.set-config.outputs.service_name }}
      app_path: ${{ steps.set-config.outputs.app_path }}
      dockerfile_path: ${{ steps.set-config.outputs.dockerfile_path }}
      build_command: ${{ steps.set-config.outputs.build_command }}
      node_version: ${{ steps.set-config.outputs.node_version }}
      port: ${{ steps.set-config.outputs.port }}
      use_build_time_env: ${{ steps.set-config.outputs.use_build_time_env }}
    steps:
      - name: Set Configuration
        id: set-config
        run: |
          echo "service_name=web" >> $GITHUB_OUTPUT
          echo "app_path=apps/ally-web" >> $GITHUB_OUTPUT
          echo "dockerfile_path=dockerfile" >> $GITHUB_OUTPUT
          echo "build_command=npm run build" >> $GITHUB_OUTPUT
          echo "node_version=20" >> $GITHUB_OUTPUT
          echo "port=3000" >> $GITHUB_OUTPUT
          echo "use_build_time_env=false" >> $GITHUB_OUTPUT

  # Check if there are changes in the app directory
  changes:
    needs: config
    runs-on: ubuntu-22.04
    outputs:
      web: ${{ steps.determine.outputs.should_proceed }}
    steps:
      - name: Determine if should proceed
        id: determine
        run: |
          # Simplified logic - no redundant path checking
          if [ "${{ github.event.inputs.force_deploy }}" == "true" ]; then
            echo "should_proceed=true" >> $GITHUB_OUTPUT
            echo "Force deploy requested - proceeding without change check"
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "should_proceed=true" >> $GITHUB_OUTPUT
            echo "Push event detected - changes exist (filtered by trigger)"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "should_proceed=true" >> $GITHUB_OUTPUT
            echo "Pull request event detected - changes exist (filtered by trigger)"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_proceed=true" >> $GITHUB_OUTPUT
            echo "Manual workflow dispatch - proceeding"
          else
            echo "should_proceed=false" >> $GITHUB_OUTPUT
            echo "No valid trigger detected"
          fi

  # Determine target environment
  determine-environment:
    needs: [config, changes]
    if: |
      (needs.changes.outputs.web == 'true' || github.event.inputs.force_deploy == 'true') && 
      github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    outputs:
      target_env: ${{ steps.env.outputs.target_env }}
      should_deploy: ${{ steps.env.outputs.should_deploy }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          MANUAL_ENV="${{ github.event.inputs.environment }}"

          # Determine target environment
          if [ -n "$MANUAL_ENV" ]; then
            TARGET_ENV="$MANUAL_ENV"
          else
            case $BRANCH in
              "dev")
                TARGET_ENV="dev"
                ;;
              "stg")
                TARGET_ENV="stg"
                ;;
              "main"|"master")
                TARGET_ENV="prd"
                ;;
              *)
                echo "No deployment configured for branch: $BRANCH"
                TARGET_ENV=""
                ;;
            esac
          fi

          if [ -n "$TARGET_ENV" ]; then
            echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo ":rocket: Deploying to: $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo ":warning: No deployment target determined" >> $GITHUB_STEP_SUMMARY
          fi

  # Deploy to determined environment
  deploy:
    needs:
      - config
      - changes
      - determine-environment
    if: needs.determine-environment.outputs.should_deploy == 'true'
    uses: ./.github/workflows/deploy-ecs-service.yml
    with:
      service_name: ${{ needs.config.outputs.service_name }}
      app_path: ${{ needs.config.outputs.app_path }}
      environment: ${{ needs.determine-environment.outputs.target_env }}
      dockerfile_path: ${{ needs.config.outputs.dockerfile_path }}
      build_command: ${{ needs.config.outputs.build_command }}
      node_version: ${{ needs.config.outputs.node_version }}
      port: ${{ needs.config.outputs.port }}
      use_build_time_env: ${{ needs.config.outputs.use_build_time_env }}
  # Build and test on pull requests (no deployment)
  test:
    needs: [config, changes]
    if: |
      (needs.changes.outputs.web == 'true' || github.event.inputs.force_deploy == 'true') && 
      github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        run: |
          # Run tests for the specific app using Nx
          npx nx test ally-web || echo "No tests found for ally-web"

      - name: Build Application
        run: npx nx build ally-web

      - name: PR Summary
        run: |
          echo ":white_check_mark: Build and tests completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- Service: ${{ needs.config.outputs.service_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- No deployment performed (PR only)" >> $GITHUB_STEP_SUMMARY
