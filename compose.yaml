version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: apps/lifeline-web/Dockerfile.dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - HOST=0.0.0.0
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/lifeline-web/node_modules
      - web_lib_node_modules:/app/libs/ui-shared/node_modules
    restart: unless-stopped

  helpline:
    build:
      context: .
      dockerfile: apps/lifeline-helpline-dashboard/Dockerfile.dev
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
    volumes:
      - .:/app
      - helpline_node_modules:/app/node_modules
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/lifeline-admin-dashboard/Dockerfile.dev
    working_dir: /app
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
    volumes:
      - .:/app
      - admin_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  web_node_modules:
  web_app_node_modules:
  web_lib_node_modules:
  helpline_node_modules:
  admin_node_modules:
# Notes:
# - This file is intended for local development. It mounts your project into each container so
#   code changes are visible immediately (hot-reload).
# - Each service uses its own named volume for node_modules to avoid conflicts between host
#   and container-installed packages.
# - If any Dockerfile.dev does not set the container start command, you may need to add a
#   `command:` line per service (e.g. `command: ["npm", "run", "dev"]`).
# - Keep an eye on the Dockerfile.dev files: they should expose the same ports as mapped
#   here (3000, 8080, 8081) and listen on 0.0.0.0 for the HOST variable to work.
