services:
  web:
    build:
      context: .
      dockerfile: apps/ally-web/Dockerfile.dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - HOST=0.0.0.0
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules

  helpline:
    build:
      context: .
      dockerfile: apps/ally-helpline-dashboard/Dockerfile.dev
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - helpline_node_modules:/app/node_modules

  admin:
    build:
      context: .
      dockerfile: apps/ally-admin-dashboard/Dockerfile.dev
    working_dir: /app
    ports:
      - "8081:8080"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - admin_node_modules:/app/node_modules

volumes:
  web_node_modules:
  helpline_node_modules:
  admin_node_modules:
